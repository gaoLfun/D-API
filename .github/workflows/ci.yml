name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dapi_test
          POSTGRES_USER: dapi
          POSTGRES_PASSWORD: dapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dapi -d dapi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DAPI_TEST_DATABASE_URL: postgres://dapi:dapi@127.0.0.1:5432/dapi_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results/

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/paseo-relay-usage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: plugins/paseo-relay-usage/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag dapi:ci .
